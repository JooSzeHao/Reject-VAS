<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="MyUBAT">
  <defs>
    <linearGradient id="mu-bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#C62C8C"/>
      <stop offset="1" stop-color="#8B2CC4"/>
    </linearGradient>
    <linearGradient id="mu-red" x1="0.05" y1="0.05" x2="0.85" y2="0.8">
      <stop offset="0" stop-color="#6E080E"/>
      <stop offset="0.5" stop-color="#C0101A"/>
      <stop offset="1" stop-color="#F03030"/>
    </linearGradient>
    <path id="mu-heart" d="M50,88 C22,64 8,50 8,33 C8,19 18,9 31,9 C39,9 46,13 50,20 C54,13 61,9 69,9 C82,9 92,19 92,33 C92,50 78,64 50,88 Z"/>
    <rect id="mu-pill" x="-18" y="-10" width="36" height="20" rx="10" ry="10"/>
    <clipPath id="mu-clip"><use href="#mu-pill"/></clipPath>
  </defs>

  <rect x="2" y="2" width="96" height="96" rx="23" ry="23" fill="url(#mu-bg)"/>

  <!-- heart: white halo, then black keyline over the red gradient -->
  <g transform="translate(45.5 44) rotate(-37) scale(0.70) translate(-50 -50)">
    <use href="#mu-heart" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linejoin="round"/>
    <use href="#mu-heart" fill="url(#mu-red)" stroke="#141414" stroke-width="8.5" stroke-linejoin="round"/>
  </g>

  <!-- capsule: sits over the heart's lower-right edge -->
  <g transform="translate(61.5 63.5) rotate(48)">
    <use href="#mu-pill" fill="none" stroke="#FFFFFF" stroke-width="11"/>
    <g clip-path="url(#mu-clip)">
      <rect x="-18" y="-10" width="18" height="20" fill="#FFFFFF"/>
      <rect x="0" y="-10" width="18" height="20" fill="#2E8BC9"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#141414" stroke-width="4.6"/>
    </g>
    <use href="#mu-pill" fill="none" stroke="#141414" stroke-width="4.6"/>
  </g>
</svg>
